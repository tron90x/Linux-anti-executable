# Linux Anti-Executable Configuration
# /etc/lexec/lexec.conf

# Database location
database_path = /var/lib/lexec/whitelist.db

# Socket for GUI communication
socket_path = /var/run/lexec/lexec.sock

# Enable learning mode on first run
# When enabled, all executables are auto-whitelisted
# Set to 0 after initial setup
learning_mode = 0

# Log allowed executions (creates audit trail)
# Warning: This can generate large log files
log_allowed = 0

# Log denied executions
log_denied = 1

# Timeout for GUI response (seconds)
# If no response within timeout, deny execution
gui_timeout = 30

# Directories to monitor
# Comma-separated list of mount points
monitor_paths = /

# Directories to exclude from monitoring
# System directories that should always be allowed
exclude_paths = /proc,/sys,/dev

# Auto-whitelist system directories on first scan
scan_on_first_run = 1

# Directories to scan for initial whitelist
# These are scanned when --scan is used
scan_paths = /bin,/sbin,/usr/bin,/usr/sbin,/usr/local/bin,/lib,/lib64,/usr/lib,/usr/lib64
