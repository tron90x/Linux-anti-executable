# Linux Anti-Executable Configuration
# /etc/lexec/lexec.conf

# =============================================================================
# Database Settings
# =============================================================================

# Database location for whitelist
database_path = /var/lib/lexec/whitelist.db

# Socket for GUI communication
socket_path = /var/run/lexec/lexec.sock

# =============================================================================
# Operation Mode
# =============================================================================

# Learning mode: When enabled, all new executables are auto-whitelisted
# Recommended: Enable during initial setup, then disable
# Values: 0 = disabled (enforce whitelist), 1 = enabled (auto-allow)
learning_mode = 0

# Default action when GUI doesn't respond or is not connected
# Values: 0 = allow (less secure), 1 = deny (more secure)
default_deny = 1

# GUI response timeout in seconds
# If user doesn't respond within this time, default_deny action is taken
gui_timeout = 30

# =============================================================================
# Monitoring Settings
# =============================================================================

# Monitor shared library (.so) loading in addition to executables
# Values: 0 = executables only, 1 = executables + shared libraries
monitor_shared_libs = 1

# Paths to exclude from monitoring (comma-separated)
# Files in these paths are always allowed without checking
# IMPORTANT: Include /proc, /sys, /dev to avoid system issues
exclude_paths = /proc,/sys,/dev,/run,/snap

# =============================================================================
# Logging
# =============================================================================

# Log to syslog (viewable with: journalctl -u lexec-daemon)
# Values: 0 = disabled, 1 = enabled
log_to_syslog = 1

# =============================================================================
# Initial Scan (used with --scan flag)
# =============================================================================

# Directories to scan for initial whitelist population
# These are scanned recursively when daemon is started with --scan
scan_paths = /bin,/sbin,/usr/bin,/usr/sbin,/usr/local/bin,/usr/local/sbin,/lib,/lib64,/usr/lib,/usr/lib64,/opt
